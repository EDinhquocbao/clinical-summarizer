# Cấu hình huấn luyện tóm tắt (seq2seq)
model_name: facebook/bart-base                     # thử thêm: t5-base, allenai/led-base-16384
max_source_length: 1024                            # LED có thể tăng lên nhiều hơn
max_target_length: 256
batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 3.0e-5
epochs: 3
fp16: true                                         # tắt nếu không có GPU
use_entity_guidance: false                         # true = đưa danh sách thực thể vào đầu vào (thí nghiệm b)
seed: 42
output_dir: models/sum_bart
